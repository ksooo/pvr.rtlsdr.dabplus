name: Build
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Version of the add-on to build, by default the commit that triggered the run
        type: string
        default: ''
      package:
        description: Upload the zips of the platforms the add-on repository serves
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      package:
        description: Upload the zips of the platforms the add-on repository serves
        type: boolean
        default: true

env:
  app_id: pvr.rtlsdr.dabplus
  # Binary add-ons only load in the Kodi version whose API they were built against
  kodi_branch: Piers
  definition_dir: ${{ github.workspace }}/pvr.rtlsdr.dabplus/.github/definition

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux GCC"
            os: ubuntu-latest
            CC: gcc
            CXX: g++
          - name: "Linux Clang"
            os: ubuntu-latest
            CC: clang
            CXX: clang++
          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            CC: gcc
            CXX: g++
          - name: "macOS arm64"
            os: macos-latest
            platform: osx-arm64
          - name: "macOS x86_64"
            os: macos-15-intel
            platform: osx-x86_64
          - name: "Windows x64"
            os: windows-2022
            cmake_args: -G "Visual Studio 17 2022" -A x64
            platform: windows-x86_64
          - name: "Windows x86"
            os: windows-2022
            cmake_args: -G "Visual Studio 17 2022" -A Win32
            platform: windows-i686
          - name: "Windows ARM64"
            os: windows-2022
            cmake_args: -G "Visual Studio 17 2022" -A ARM64 -T host=x64
            platform: windows-arm64
            cross_compiling: true
          # Android needs the NDK toolchain that Kodi's depends set up
          - name: "Android aarch64"
            os: ubuntu-latest
            depends_host: aarch64-linux-android
            platform: android-aarch64
            cross_compiling: true
          - name: "Android armv7"
            os: ubuntu-latest
            depends_host: arm-linux-androideabi
            platform: android-armv7
            cross_compiling: true
    steps:
    - name: Checkout Kodi repo
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: ${{ env.kodi_branch }}
        path: xbmc
    - name: Checkout add-on repo
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        path: ${{ env.app_id }}
    - name: Configure
      if: ${{ !matrix.depends_host }}
      shell: bash
      env:
        CC: ${{ matrix.CC }}
        CXX: ${{ matrix.CXX }}
      run: |
        cmake ${{ matrix.cmake_args }} \
          -B ${app_id}/build \
          -DADDONS_TO_BUILD=${app_id} \
          -DADDON_SRC_PREFIX="${{ github.workspace }}" \
          -DADDONS_DEFINITION_DIR="${definition_dir}" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/xbmc/addons" \
          -DPACKAGE_ZIP=1 \
          "${{ github.workspace }}/xbmc/cmake/addons"
    - name: Build
      if: ${{ !matrix.depends_host }}
      shell: bash
      run: cmake --build ${app_id}/build --config Release --parallel --target package-${app_id}
    - name: Install Android NDK
      if: ${{ matrix.depends_host }}
      run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
    - name: Configure depends
      if: ${{ matrix.depends_host }}
      working-directory: xbmc/tools/depends
      run: |
        ./bootstrap
        ./configure --prefix="$HOME/kodi-deps" --host=${{ matrix.depends_host }} \
                    --with-sdk-path="$ANDROID_SDK_ROOT" --enable-debug=no
    - name: Build with depends
      if: ${{ matrix.depends_host }}
      run: |
        automake_dir=$(automake --print-libdir)
        make -C xbmc/tools/depends/target/binary-addons ADDONS=${app_id} PACKAGE=1 \
             EXTRA_CMAKE_ARGS=-DPACKAGE_ZIP=ON ADDONS_DEFINITION_DIR="${definition_dir}" \
             ADDON_SRC_PREFIX="${{ github.workspace }}" CMAKE=cmake \
             CONFIG_SUB="${automake_dir}/config.sub" CONFIG_GUESS="${automake_dir}/config.guess"
    - name: Test
      if: ${{ !matrix.cross_compiling }}
      shell: bash
      run: |
        ctest --test-dir ${app_id}/build/${app_id}-prefix/src/${app_id}-build -C Release --output-on-failure
    - name: Collect
      if: ${{ matrix.platform }}
      shell: bash
      env:
        PLATFORM: ${{ matrix.platform }}
      run: |
        # The directory carries the platform Kodi's build wrote into addon.xml. binary-addons does
        # not fail when an add-on fails to build, a missing zip does. Not every platform has all of
        # the searched directories.
        zip=$(find ${app_id}/build xbmc "$HOME/kodi-deps" -path "*/zips/${app_id}+${PLATFORM}/${app_id}-*.zip" \
                   -print -quit 2>/dev/null || true)
        test -n "$zip"
        mkdir dist
        cp "$zip" "dist/$(basename "$zip" .zip)-${PLATFORM}.zip"
    - name: Upload
      if: ${{ inputs.package && matrix.platform }}
      uses: actions/upload-artifact@v4
      with:
        name: zip-${{ matrix.platform }}
        path: dist/*.zip

  debian:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Kodi repo
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: ${{ env.kodi_branch }}
        path: xbmc
    - name: Checkout add-on repo
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        path: ${{ env.app_id }}
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev debhelper cmake patch libfaad-dev libfmt-dev libkissfft-dev \
                                libmpg123-dev librtlsdr-dev libusb-1.0-0-dev nlohmann-json3-dev
    # There is no kodi-addon-dev package for Kodi Piers; Kodi's add-on build system provides
    # the same files when it is configured
    - name: Prepare Kodi add-on development files
      run: |
        cmake -B kodi-dev -DADDONS_TO_BUILD=${app_id} -DCMAKE_INSTALL_PREFIX=/usr \
              -DADDONS_DEFINITION_DIR="${definition_dir}" \
              -DADDON_SRC_PREFIX="${{ github.workspace }}" xbmc/cmake/addons
        # Install into /usr like with kodi-addon-dev
        sed -i -e 's|^  set(KODI_LIB_DIR .*|  set(KODI_LIB_DIR /usr/lib/kodi)|' \
               -e 's|^  set(KODI_DATA_DIR .*|  set(KODI_DATA_DIR /usr/share/kodi)|' \
               kodi-dev/build/depends/lib/kodi/KodiConfig.cmake
        grep -E "KODI_(PREFIX|LIB_DIR|DATA_DIR)" kodi-dev/build/depends/lib/kodi/KodiConfig.cmake
    - name: Build
      working-directory: ${{ env.app_id }}
      run: |
        version=$(sed -n 's/.*version="\([0-9.]*\)".*/\1/p' ${app_id}/addon.xml.in | head -1)
        sed -e "s/#PACKAGEVERSION#/${version}/" -e "s/#TAGREV#/0/" -e "s/#DIST#/noble/g" \
            debian/changelog.in > debian/changelog
        CMAKE_PREFIX_PATH="${{ github.workspace }}/kodi-dev/build/depends" dpkg-buildpackage -us -uc -b -d
        ls ../*.deb
