name: Build
on: [push, pull_request]
env:
  app_id: pvr.rtlsdr.dabplus

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux GCC"
            os: ubuntu-latest
            CC: gcc
            CXX: g++
          - name: "Linux Clang"
            os: ubuntu-latest
            CC: clang
            CXX: clang++
          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            CC: gcc
            CXX: g++
          - name: "macOS"
            os: macos-latest
          - name: "Windows x64"
            os: windows-2022
            cmake_args: -G "Visual Studio 17 2022" -A x64
          - name: "Windows x86"
            os: windows-2022
            cmake_args: -G "Visual Studio 17 2022" -A Win32
          - name: "Windows ARM64"
            os: windows-2022
            cmake_args: -G "Visual Studio 17 2022" -A ARM64 -T host=x64
            cross_compiling: true
          - name: "Windows UWP"
            os: windows-2022
            cmake_args: -G "Visual Studio 17 2022" -A x64 -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0.22621.0
            cross_compiling: true
    steps:
    - name: Checkout Kodi repo
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: master
        path: xbmc
    - name: Checkout add-on repo
      uses: actions/checkout@v5
      with:
        path: ${{ env.app_id }}
    - name: Prepare
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/definition/${app_id}"
        echo "${app_id} ${{ github.workspace }}/${app_id}" > "${{ github.workspace }}/definition/${app_id}/${app_id}.txt"
    - name: Configure
      shell: bash
      env:
        CC: ${{ matrix.CC }}
        CXX: ${{ matrix.CXX }}
      run: |
        cmake ${{ matrix.cmake_args }} \
          -B ${app_id}/build \
          -DADDONS_TO_BUILD=${app_id} \
          -DADDON_SRC_PREFIX="${{ github.workspace }}" \
          -DADDONS_DEFINITION_DIR="${{ github.workspace }}/definition" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/xbmc/addons" \
          -DPACKAGE_ZIP=1 \
          "${{ github.workspace }}/xbmc/cmake/addons"
    - name: Build
      shell: bash
      run: |
        cmake --build ${app_id}/build --config Release --parallel
    - name: Test
      if: ${{ !matrix.cross_compiling }}
      shell: bash
      run: |
        ctest --test-dir ${app_id}/build/${app_id}-prefix/src/${app_id}-build -C Release --output-on-failure

  webos:
    name: webOS
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kodi repo
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: master
        path: xbmc
    - name: Checkout add-on repo
      uses: actions/checkout@v5
      with:
        path: ${{ env.app_id }}
    - name: Install toolchain
      run: |
        curl -sfL https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz | tar xz -C "$HOME"
        "$HOME/arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh"
    - name: Configure
      working-directory: xbmc/tools/depends
      run: |
        ./bootstrap
        ./configure --prefix="$HOME/kodi-deps" --host=arm-webos-linux-gnueabi \
                    --with-toolchain="$HOME/arm-webos-linux-gnueabi_sdk-buildroot" --enable-debug=no
    - name: Build
      run: |
        mkdir -p "${{ github.workspace }}/definition/${app_id}"
        echo "${app_id} ${{ github.workspace }}/${app_id}" > "${{ github.workspace }}/definition/${app_id}/${app_id}.txt"
        automake_dir=$(automake --print-libdir)
        make -C xbmc/tools/depends/target/binary-addons ADDONS=${app_id} \
             ADDONS_DEFINITION_DIR="${{ github.workspace }}/definition" \
             ADDON_SRC_PREFIX="${{ github.workspace }}" CMAKE=cmake \
             CONFIG_SUB="${automake_dir}/config.sub" CONFIG_GUESS="${automake_dir}/config.guess"
        # binary-addons does not fail when an add-on fails to build
        find "$HOME/kodi-deps" -path "*/addons/*" -name "${app_id}.so*" | grep .

  debian:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Kodi repo
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: master
        path: xbmc
    - name: Checkout add-on repo
      uses: actions/checkout@v5
      with:
        path: ${{ env.app_id }}
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev debhelper cmake patch libfaad-dev libfmt-dev libkissfft-dev \
                                libmpg123-dev librtlsdr-dev libusb-1.0-0-dev nlohmann-json3-dev
    # There is no kodi-addon-dev package for Kodi's master branch; Kodi's add-on build system provides
    # the same files when it is configured
    - name: Prepare Kodi add-on development files
      run: |
        mkdir -p "${{ github.workspace }}/definition/${app_id}"
        echo "${app_id} ${{ github.workspace }}/${app_id}" > "${{ github.workspace }}/definition/${app_id}/${app_id}.txt"
        cmake -B kodi-dev -DADDONS_TO_BUILD=${app_id} -DCMAKE_INSTALL_PREFIX=/usr \
              -DADDONS_DEFINITION_DIR="${{ github.workspace }}/definition" \
              -DADDON_SRC_PREFIX="${{ github.workspace }}" xbmc/cmake/addons
        # Install into /usr like with kodi-addon-dev
        sed -i -e 's|^  set(KODI_LIB_DIR .*|  set(KODI_LIB_DIR /usr/lib/kodi)|' \
               -e 's|^  set(KODI_DATA_DIR .*|  set(KODI_DATA_DIR /usr/share/kodi)|' \
               kodi-dev/build/depends/lib/kodi/KodiConfig.cmake
        grep -E "KODI_(PREFIX|LIB_DIR|DATA_DIR)" kodi-dev/build/depends/lib/kodi/KodiConfig.cmake
    - name: Build
      working-directory: ${{ env.app_id }}
      run: |
        version=$(sed -n 's/.*version="\([0-9.]*\)".*/\1/p' ${app_id}/addon.xml.in | head -1)
        sed -e "s/#PACKAGEVERSION#/${version}/" -e "s/#TAGREV#/0/" -e "s/#DIST#/noble/g" \
            debian/changelog.in > debian/changelog
        CMAKE_PREFIX_PATH="${{ github.workspace }}/kodi-dev/build/depends" dpkg-buildpackage -us -uc -b -d
        ls ../*.deb
